apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-tag-and-resources
  annotations:
    policies.kyverno.io/title: Require Image Tags and Resource Requests/Limits
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Requires all container images to use an explicit tag and requires
      CPU and memory requests and limits on every container.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Every container image must use an explicit tag (e.g. nginx:1.27)."
        pattern:
          spec:
            containers:
              - image: "*:*"
    - name: require-resource-requests-and-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Every container must define CPU and memory requests and limits."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"