apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
spec:
  project: default
  source:
    chart: cilium
    repoURL: https://helm.cilium.io/
    targetRevision: 1.20.1
    helm:
      releaseName: cilium
      values: |
        kubeProxyReplacement: true
        operator:
          replicas: 1
        bpf:
          masquerade: true
        ipam:
          mode: kubernetes
        k8sServiceHost: 192.168.68.90
        k8sServicePort: "6443"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true